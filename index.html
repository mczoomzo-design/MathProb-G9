<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>เกมความน่าจะเป็น ม.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#211d3b;              /* near-black outline/text */
  --paper:#fff;
  --bg:#fef3d8;              /* warm cream */
  --purple:#7c3aed; --pink:#ec4899; --red:#ff5a5f; --coral:#ff6b6b;
  --orange:#ff9f43; --yellow:#ffd23f; --cyan:#38bdf8; --teal:#22d3aa;
  --green:#2fbf71; --mint:#6ee7a8; --blue:#4f8cff;
  --muted:#6f6a86; --line:#211d3b;
  --hard:4px 4px 0 var(--ink);
  --hard-lg:6px 6px 0 var(--ink);
  --hard-sm:3px 3px 0 var(--ink);
  --radius:20px; --radius-md:16px; --radius-sm:12px;
  --dur:200ms; --ease:cubic-bezier(.34,1.56,.64,1); /* overshoot = bouncy */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sarabun','Kanit',system-ui,sans-serif;color:var(--ink);
  background:
   radial-gradient(circle at 12% 8%,rgba(124,58,237,.16),transparent 30%),
   radial-gradient(circle at 88% 6%,rgba(236,72,153,.16),transparent 28%),
   radial-gradient(circle at 78% 92%,rgba(56,189,248,.16),transparent 30%),
   radial-gradient(circle at 8% 90%,rgba(47,191,113,.14),transparent 28%),
   var(--bg);
  background-attachment:fixed;
}
#root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:22px 16px calc(60px + env(safe-area-inset-bottom))}
.screen{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;animation:pop-in var(--dur) var(--ease)}
.screen.home{max-width:1060px}
.screen.playing{max-width:600px}
@keyframes pop-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--hard-lg)}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{position:relative;width:56px;height:56px;flex-shrink:0;background:var(--yellow);color:var(--ink);
  font-family:'Kanit';font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--ink);border-radius:16px;box-shadow:var(--hard);transform:rotate(-4deg);animation:wobble 3s ease-in-out infinite}
.brand-badge::after{content:"★";position:absolute;top:-12px;right:-10px;font-size:20px;color:var(--pink);
  -webkit-text-stroke:1.5px var(--ink);animation:spin-star 4s linear infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spin-star{to{transform:rotate(360deg)}}
.brand h1{font-family:'Kanit';font-size:25px;font-weight:800;margin:0;color:var(--purple);letter-spacing:.3px}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.sub-note{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.header-right{display:flex;align-items:center;gap:10px}
.status-pill{font-size:12px;font-weight:700;padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;box-shadow:var(--hard-sm)}
.status-pill.online{background:var(--mint)} .status-pill.offline{background:var(--yellow)}
.admin-link{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;
  font-family:'Kanit';font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;box-shadow:var(--hard-sm);transition:transform .1s}
.admin-link:hover{transform:translate(-1px,-1px)} .admin-link:active{transform:translate(2px,2px);box-shadow:none}

/* ---------- layout ---------- */
.home-layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.home-layout{grid-template-columns:340px 1fr;align-items:start}}
.home-side{display:flex;flex-direction:column;gap:14px}
.home-main{display:flex;flex-direction:column;gap:14px}
.section-title{font-family:'Kanit';font-weight:800;font-size:19px;margin:2px 0;color:var(--ink)}
.section-title::before{content:"▸ ";color:var(--pink)}

/* ---------- cards / inputs ---------- */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);padding:18px;box-shadow:var(--hard-lg)}
.rank-card{background:linear-gradient(135deg,#fff,#fff7e6)}
.rank-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.rank-badge{color:#fff;font-family:'Kanit';font-weight:700;font-size:14px;padding:7px 16px;border:2.5px solid var(--ink);border-radius:999px;box-shadow:var(--hard-sm);-webkit-text-stroke:.3px var(--ink)}
.xp-text{font-family:'Kanit';font-weight:800;font-size:20px;color:var(--purple)}
.progress-track{height:16px;background:#efeafc;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background-image:linear-gradient(45deg,rgba(255,255,255,.35) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%);background-size:16px 16px;transition:width .5s var(--ease);animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:16px 0}}
.hint{margin:9px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
.warn-text{margin:9px 0 0;font-size:13.5px;color:var(--red);font-weight:700}
.field-label{display:block;font-family:'Kanit';font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:7px}
.field-col{flex:1;display:flex;flex-direction:column}
.text-input{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:3px solid var(--ink);font-size:15px;font-family:inherit;font-weight:600;background:#fffdf6;color:var(--ink);box-shadow:var(--hard-sm)}
.text-input:focus{outline:none;background:#fff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--purple)}
textarea.text-input{resize:vertical}
select.text-input{cursor:pointer}

/* ---------- buttons ---------- */
.btn-primary{font-family:'Kanit';font-weight:800;font-size:17px;padding:15px;background:var(--purple);color:#fff;
  border:3px solid var(--ink);border-radius:var(--radius-sm);cursor:pointer;box-shadow:var(--hard);transition:transform .1s,box-shadow .1s;-webkit-text-stroke:.3px var(--ink)}
.btn-primary:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn-primary:active{transform:translate(4px,4px);box-shadow:none}
.btn-primary:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--hard)}
.board-btn{background:var(--yellow);color:var(--ink);-webkit-text-stroke:0}
.btn-secondary{font-family:'Kanit';font-weight:700;font-size:14.5px;padding:13px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:var(--radius-sm);cursor:pointer;box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s}
.btn-secondary:hover{transform:translate(-1px,-1px)} .btn-secondary:active{transform:translate(3px,3px);box-shadow:none}
.btn-secondary:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.submit-btn{width:100%;margin-top:16px}

/* ---------- mode tiles (arcade, colorful) ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:860px){.mode-grid{grid-template-columns:1fr 1fr 1fr}}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;color:var(--ink);
  border:3px solid var(--ink);border-radius:var(--radius-md);padding:16px 15px;cursor:pointer;font-family:inherit;
  box-shadow:var(--hard);transition:transform .12s var(--ease),box-shadow .12s;animation:tile-in .3s var(--ease) backwards}
.mode-card:nth-child(1){background:var(--yellow);animation-delay:40ms}
.mode-card:nth-child(2){background:var(--coral);animation-delay:90ms}
.mode-card:nth-child(3){background:#c4a5ff;animation-delay:140ms}
.mode-card:nth-child(4){background:var(--cyan);animation-delay:190ms}
.mode-card:nth-child(5){background:var(--orange);animation-delay:240ms}
.mode-card:nth-child(6){background:var(--mint);animation-delay:290ms}
@keyframes tile-in{from{opacity:0;transform:translateY(10px) rotate(-2deg)}to{opacity:1;transform:none}}
.mode-card:hover:not(:disabled){transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink)}
.mode-card:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.mode-card:disabled{opacity:.5;cursor:default;filter:grayscale(.3)}
.mode-icon{font-size:30px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.15))}
.mode-title{font-family:'Kanit';font-weight:800;font-size:16.5px;color:var(--ink)}
.mode-desc{font-size:12px;color:var(--ink);opacity:.78;line-height:1.45;font-weight:600}
.formats-note{font-size:12.5px;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:var(--radius-sm);padding:11px 13px;margin:2px 0 0;line-height:1.55;font-weight:600;box-shadow:var(--hard-sm)}
.formats-note::before{content:"🎲 ";}

/* ---------- playing ---------- */
.back-link{align-self:flex-start;background:var(--paper);border:2.5px solid var(--ink);cursor:pointer;font-family:'Kanit';font-size:13.5px;color:var(--ink);padding:6px 14px;font-weight:700;border-radius:999px;box-shadow:var(--hard-sm)}
.back-link:active{transform:translate(2px,2px);box-shadow:none}
.hud{display:flex;align-items:center;justify-content:space-between;font-family:'Kanit'}
.hud-hearts{display:flex;gap:5px;font-size:24px}
.heart.full{color:var(--red);filter:drop-shadow(1px 1px 0 var(--ink))} .heart.empty{color:#d9d5e8}
.hud-score{font-weight:800;font-size:16px;color:var(--purple);background:#fff;border:2.5px solid var(--ink);padding:5px 14px;border-radius:999px;box-shadow:var(--hard-sm)}
.hud-combo{color:var(--ink);font-weight:800;font-size:17px;min-width:52px;text-align:right}
.hud .hint{margin:0;background:#fff;border:2.5px solid var(--ink);padding:5px 12px;border-radius:999px;box-shadow:var(--hard-sm);color:var(--ink)}
.timer-track{height:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width 1s linear}
.timer-fill.low{background:linear-gradient(90deg,var(--red),var(--orange));animation:blink .6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}

.question-card{position:relative;padding-top:15px;animation:slide-q var(--dur) var(--ease)}
@keyframes slide-q{from{opacity:0;transform:translateX(14px) rotate(1deg)}to{opacity:1;transform:none}}
.q-tags{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.diff-tag,.type-tag,.src-tag{font-family:'Kanit';font-size:11px;font-weight:700;padding:3px 11px;border:2px solid var(--ink);border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
.diff-tag{background:var(--mint)}
.diff-medium .diff-tag{background:var(--yellow)} .diff-hard .diff-tag{background:var(--coral)}
.type-tag{background:var(--cyan)} .src-tag{background:#eee}
.question-text{font-family:'Kanit';font-size:19px;line-height:1.55;margin:0;font-weight:600}

/* MC options */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.option-btn{font-family:'Kanit';font-size:17px;font-weight:700;padding:20px 12px;border-radius:var(--radius-md);border:3px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink);min-height:60px;box-shadow:var(--hard);transition:transform .1s,box-shadow .1s}
.option-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.option-btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.option-btn:disabled{cursor:default}
.option-btn.correct{background:var(--green);color:#fff;-webkit-text-stroke:.4px var(--ink);animation:bounce .5s var(--ease)}
.option-btn.wrong{background:var(--red);color:#fff;-webkit-text-stroke:.4px var(--ink);animation:shake .4s}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.09) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* True/False */
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf-btn{font-family:'Kanit';font-weight:800;font-size:22px;padding:30px 10px;border-radius:var(--radius-md);border:3px solid var(--ink);cursor:pointer;box-shadow:var(--hard);transition:transform .1s,box-shadow .1s}
.tf-btn.yes{background:var(--mint)} .tf-btn.no{background:var(--coral)}
.tf-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tf-btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.tf-btn.correct{background:var(--green);color:#fff} .tf-btn.wrong{background:var(--red);color:#fff}

/* Fraction */
.frac-card{display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,#fff,#f3efff)}
.frac-input{display:flex;flex-direction:column;align-items:center;gap:7px}
.frac-field{width:130px;text-align:center;font-family:'Kanit';font-weight:800;font-size:28px;padding:10px;border:3px solid var(--ink);border-radius:var(--radius-sm);background:#fff;box-shadow:var(--hard-sm)}
.frac-field:focus{outline:none;box-shadow:4px 4px 0 var(--purple)}
.frac-bar{width:150px;height:5px;background:var(--ink);border-radius:3px}

/* Estimate */
.est-card{display:flex;flex-direction:column;gap:14px;align-items:center;background:linear-gradient(135deg,#fff,#eafaff)}
.est-value{font-family:'Kanit';font-weight:800;font-size:40px;color:var(--purple);-webkit-text-stroke:1px var(--ink)}
.est-slider{width:100%;-webkit-appearance:none;height:18px;border-radius:10px;border:3px solid var(--ink);background:linear-gradient(90deg,#fff,var(--cyan));outline:none;box-shadow:var(--hard-sm)}
.est-slider::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);cursor:pointer;box-shadow:var(--hard-sm)}
.est-slider::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);cursor:pointer}
.est-scale{display:flex;justify-content:space-between;width:100%;font-size:11px;color:var(--muted);font-weight:700}

/* Multiselect */
.multi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.multi-chip{font-family:'Kanit';font-weight:800;font-size:20px;padding:20px 8px;border-radius:var(--radius-md);border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:var(--hard);transition:transform .1s,box-shadow .1s}
.multi-chip:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.multi-chip:active:not(:disabled){transform:translate(2px,2px);box-shadow:var(--hard-sm)}
.multi-chip.on{background:var(--yellow)}
.multi-chip.correct{background:var(--green);color:#fff} .multi-chip.wrong{background:var(--red);color:#fff}

.feedback-banner{font-family:'Kanit';font-size:15px;padding:14px 16px;border:3px solid var(--ink);border-radius:var(--radius-sm);font-weight:700;line-height:1.5;box-shadow:var(--hard);animation:pop-in var(--dur) var(--ease)}
.feedback-banner.correct{background:var(--mint)} .feedback-banner.wrong{background:#ffe0e0}

/* result */
.result-card{display:flex;flex-direction:column;gap:12px}
.result-row{display:flex;justify-content:space-between;font-family:'Kanit';font-weight:600;font-size:16px;padding-bottom:11px;border-bottom:3px dotted var(--line)}
.result-row:last-child{border-bottom:none;padding-bottom:0}
.result-row strong{font-weight:800}

/* ---------- scoreboard ---------- */
.sb-header{display:flex;align-items:center;justify-content:space-between}
.sb-title-wrap{display:flex;align-items:center;gap:10px}
.sb-trophy{font-size:30px;filter:drop-shadow(1px 1px 0 var(--ink));animation:wobble 2.5s ease-in-out infinite}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:8px 0 4px}
.podium-slot{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop-in .5s var(--ease) backwards}
.podium-slot.p2{animation-delay:90ms}.podium-slot.p3{animation-delay:170ms}
.podium-medal{font-size:26px}
.podium-avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Kanit';font-weight:800;font-size:22px;border:3px solid var(--ink);box-shadow:var(--hard-sm);-webkit-text-stroke:.4px var(--ink)}
.podium-slot.p1 .podium-avatar{width:66px;height:66px;font-size:28px}
.podium-name{font-family:'Kanit';font-weight:700;font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.podium-rankchip{font-family:'Kanit';font-size:10px;font-weight:700;color:#fff;padding:2px 9px;border:2px solid var(--ink);border-radius:999px;-webkit-text-stroke:.3px var(--ink)}
.podium-base{width:100%;border:3px solid var(--ink);border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:2px;color:var(--ink);box-shadow:var(--hard-sm)}
.podium-slot.p1 .podium-base{height:94px;background:var(--yellow)}
.podium-slot.p2 .podium-base{height:72px;background:#dfe4ec}
.podium-slot.p3 .podium-base{height:58px;background:var(--orange)}
.podium-pos{font-family:'Kanit';font-weight:800;font-size:17px}
.podium-xp{font-family:'Kanit';font-weight:800;font-size:15px}
.podium-xp small{font-weight:600;font-size:10px;opacity:.8}
.sb-tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px}
.sb-tab{flex:none;font-family:'Kanit';font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:var(--hard-sm)}
.sb-tab.active{background:var(--purple);color:#fff;-webkit-text-stroke:.3px var(--ink)}
.sb-list{display:flex;flex-direction:column;gap:10px}
.sb-row{display:grid;grid-template-columns:28px 46px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--hard);animation:pop-in var(--dur) var(--ease) backwards}
.sb-row.me{background:#fff5c9}
.sb-pos{font-family:'Kanit';font-weight:800;font-size:17px;color:var(--muted);text-align:center}
.sb-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Kanit';font-weight:800;font-size:18px;border:2.5px solid var(--ink);-webkit-text-stroke:.3px var(--ink)}
.sb-mid{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-name-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sb-name{font-family:'Kanit';font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-me-tag{font-family:'Kanit';font-size:10px;font-weight:700;color:#fff;background:var(--purple);padding:1px 9px;border:2px solid var(--ink);border-radius:999px}
.sb-rankchip{font-family:'Kanit';font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border:2px solid var(--ink);border-radius:999px;-webkit-text-stroke:.3px var(--ink)}
.sb-sub{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-weight:600}
.sb-value{text-align:right;display:flex;flex-direction:column;gap:1px}
.sb-value-num{font-family:'Kanit';font-weight:800;font-size:19px;color:var(--purple)}
.sb-value-label{font-size:10px;color:var(--muted);font-weight:700}
.my-pos-card{margin-top:6px;border:3px dashed var(--purple);border-radius:var(--radius-md);padding:5px}
.my-pos-head{font-family:'Kanit';font-size:12px;font-weight:800;color:var(--purple);padding:8px 12px 4px}
.sb-empty{text-align:center;padding:28px;color:var(--muted);font-size:14.5px;white-space:pre-line;line-height:1.7;font-weight:600}

/* ---------- admin ---------- */
.admin-list{display:flex;flex-direction:column;gap:12px}
.admin-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius-md);padding:14px;box-shadow:var(--hard)}
.admin-mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.admin-qtext{font-family:'Kanit';font-weight:600;font-size:15px;margin:0;line-height:1.4}
.admin-ans{font-size:12.5px;color:var(--green);margin:0;font-weight:700}
.admin-acts{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:var(--radius-sm);border:3px solid var(--ink);background:#fff;cursor:pointer;font-size:17px;box-shadow:var(--hard-sm);transition:transform .1s}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none} .icon-btn.danger:hover{background:#ffe0e0}
.admin-form{display:flex;flex-direction:column;gap:10px}
.form-row2{display:flex;gap:10px}
.opt-row{display:flex;align-items:center;gap:9px}
.opt-radio{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;cursor:pointer;font-size:15px;color:var(--muted);box-shadow:var(--hard-sm)}
.opt-radio.on{background:var(--green);color:#fff}

.spinner{width:20px;height:20px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;display:inline-block;vertical-align:-4px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.winner-name{font-family:'Kanit';font-weight:800;font-size:22px;color:var(--purple);margin-top:6px;-webkit-text-stroke:.4px var(--ink)}

h1{font-family:'Kanit';font-weight:800;font-size:24px;margin:0}

@media(min-width:768px){.brand h1{font-size:29px}.question-text{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
